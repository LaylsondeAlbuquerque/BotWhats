<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Configuração do Bot</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f0f2f5;
        }

        details {
            border: 1px solid #ddd;
            padding: 20px;
            margin: 8px 0px 8px 0px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #075e54;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        textarea {
            width: 90%;
            height: 80px;
            margin-top: 5px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background-color: #25d366;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #128c7e;
        }

        #status {
            text-align: center;
            margin-top: 10px;
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1> Configurar Bot WhatsApp</h1>
    </header>

    <main class="card">

        <details>
            <summary> Definição de Categorias</summary>
            <div class="conteudo-interno">
                <label>Liste as categorias separadas por vírgula:</label>
                <textarea id="categorias-produtos" oninput="atualizarTodosDropdowns()"
                    placeholder="Ex: Xerox, Impressão, Plastificação" rows="3" style="width: 100%;"></textarea>
            </div>
        </details>

        <details>
            <summary>Tabela de Produtos</summary>

            <div id="lista-produtos"></div>

            <button type="button" onclick="adicionarProduto()" style="background: #007bff; margin-top: 10px;">
                + Adicionar Produto
            </button>

            <template id="template-produto">
                <div class="linha-produto" style="display: flex; gap: 10px; margin-bottom: 10px;">

                    <input type="text" class="input-codigo" placeholder="ID">

                    <select class="input-categoria-select" style="flex: 1;">
                        <option value="">Selecione...</option>
                    </select>

                    <input type="text" class="input-nome" placeholder="Nome">

                    <input type="text" class="input-preco" placeholder="0,00">

                    <button type="button" onclick="removerLinha(this)" style="background-color: red; width: 40px;">X</button>

                </div>
            </template>
        </details>

        <details>
            <summary>Dias e horas de funcionamento</summary>

            <h3>Dias da semana</h3>

            <fieldset id="group-days" onchange="getSelectedDays()">
                <legend>Dias de Atendimento</legend>
                <label><input type="checkbox" name="dias" value="0"> Domingo</label>
                <label><input type="checkbox" name="dias" value="1"> Segunda</label>
                <label><input type="checkbox" name="dias" value="2"> Terça</label>
                <label><input type="checkbox" name="dias" value="3"> Quarta</label>
                <label><input type="checkbox" name="dias" value="4"> Quinta</label>
                <label><input type="checkbox" name="dias" value="5"> Sexta</label>
                <label><input type="checkbox" name="dias" value="6"> Sábado</label>
            </fieldset>

            <h3>Horário de funcionamento</h3>

            <label>Início</label>
            <input type="time" id="inicio">

            <label>Fim</label>
            <input type="time" id="fim">

            <h3>Horário de almoço</h3>

            <label>Início</label>
            <input type="time" id="almocoInicio">

            <label>Fim</label>
            <input type="time" id="almocoFim">
        </details>

        <details>
            <summary>Resposta a primeira mensagem do cliente:</summary>

            <label>Mensagem de Saudação (Oi/Olá):</label>
            <textarea id="saudacao"></textarea>

            <label>Menu de Opções:</label>

            <div id="lista-opcoes"></div>

            <button type="button" onclick="adicionarOpcao()" style="background: #007bff; margin-top: 10px;">
                + Adicionar Opção
            </button>

            <template id="template-opcao">
                <div class="linha-opcao" style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 1px dashed #ccc;">

                    <input type="text" class="input-codigo-opcao" placeholder="1, 2, 3..." style="width: 60px;">

                    <input type="text" class="input-descricao-opcao" placeholder="Ex: Falar com atendente" style="flex: 2;">

                    <select class="input-categoria-opcao" style="flex: 2;" onchange="verificarRedirecionamento(this)">
                        <option value="">Selecione...</option>
                        <option value="orcamento">Orçamento</option>
                        <option value="presencial">Estou no local</option>
                        <option value="redirecionamento">Redirecionar para outro número</option>
                        <option value="horario">Horário de funcionamento</option>
                        <option value="ajuda">Atendimento humano</option>
                    </select>

                    <button type="button" onclick="removerLinha(this)" style="background-color: red; width: 40px;">X</button>

                    <div class="container-telefone" style="display: none; width: 100%; margin-top: 5px; padding-left: 10px; border-left: 3px solid #25d366;">
                        <label style="margin-top: 0; font-size: 14px; color: #555;">Número para Redirecionamento:</label>
                        <input type="text" class="input-telefone-opcao" placeholder="Ex: 5581986335038" style="width: 50%; padding: 5px;">
                        <small style="color: #d9534f; display: block; margin-top: 3px;">
                            ⚠️ O número deve conter o código do país (ex: 55 para o Brasil) e DDD (ex.: 5511900000000). Precisa estar registrado no WhatsApp!
                        </small>
                    </div>

                </div>
            </template>
        </details>

        <button onclick="salvar()">Salvar Alterações</button>
        <p id="status"></p>

    </main>

    <script>
        /*
        =-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=
        FUNÇÕES PARA AS CATEGORIAS DOS PRODUTOS
        =-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=
        */
        function getCategorias() {
            const texto = document.getElementById('categorias-produtos').value;
            const categorias = texto.split(',').map(c => c.trim()).filter(c => c !== '');
            return categorias;
        }

        function atualizarTodosDropdowns() {
            const categorias = getCategorias();
            const selects = document.querySelectorAll('.input-categoria-select');
            selects.forEach(select => {
                const valorSelecionadoAntes = select.value;
                select.innerHTML = '<option value="">Selecione...</option>';
                categorias.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.innerText = cat;
                    select.appendChild(option);
                });
                select.value = valorSelecionadoAntes;
            });
        }

        /*
        =-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=
        FUNÇÕES PARA COMPONENTES DINÂMICOS (OPÇÕES E PRODUTOS)
        =-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=
        */

        // NOVO: Função que checa se o campo telefone deve aparecer
        function verificarRedirecionamento(selectElement) {
            // Busca a "linha" atual onde este select está
            const linha = selectElement.closest('.linha-opcao');
            // Busca a div do telefone dentro desta mesma linha
            const containerTelefone = linha.querySelector('.container-telefone');
            
            // Se escolheu redirecionamento, mostra a div. Se não, esconde.
            if (selectElement.value === 'redirecionamento') {
                containerTelefone.style.display = 'block';
            } else {
                containerTelefone.style.display = 'none';
            }
        }

        // ----- Funções Opções -----
        function getListaOpcoes() {
            const arrayOpcoes = [];
            const lista = document.querySelectorAll('.linha-opcao');
            
            lista.forEach(linha => {
                const codigo = linha.querySelector('.input-codigo-opcao').value;
                const descricao = linha.querySelector('.input-descricao-opcao').value;
                const categoria = linha.querySelector('.input-categoria-opcao').value;
                const telefone = linha.querySelector('.input-telefone-opcao').value; // Pega o telefone digitado

                if (codigo && descricao && categoria) {
                    // Monta o objeto base
                    let opcaoObj = { id: codigo, descricao: descricao, categoria: categoria };
                    
                    // Só envia o telefone se a categoria for redirecionamento
                    if (categoria === 'redirecionamento' && telefone) {
                        opcaoObj.telefone = telefone;
                    }
                    
                    arrayOpcoes.push(opcaoObj);
                }
            });
            return arrayOpcoes;
        }

        function getDadosTabela() {
            const arrayProdutos = [];
            const lista = document.querySelectorAll('.linha-produto');
            lista.forEach(linha => {
                const codigo = linha.querySelector('.input-codigo').value;
                const nome = linha.querySelector('.input-nome').value;
                const precodigitado = linha.querySelector('.input-preco').value;
                const preco = parseFloat(precodigitado.replace(',', '.'));
                const categoria = linha.querySelector('.input-categoria-select').value;
                if (codigo && nome && preco && categoria) {
                    arrayProdutos.push({ id: codigo, nome: nome, preco: preco, categoria: categoria });
                }
            });
            return arrayProdutos;
        }

        // ==== FUNÇÕES DE TEMPLATE ====

        // Atualizado para receber o telefoneSalvo também
        function adicionarOpcao(codigo = '', descricao = '', categoriaSalva = '', telefoneSalvo = '') {
            const lista = document.getElementById('lista-opcoes');
            const template  = document.getElementById('template-opcao');
            const clone = template.content.cloneNode(true);

            clone.querySelector('.input-codigo-opcao').value = codigo;
            clone.querySelector('.input-descricao-opcao').value = descricao;
            clone.querySelector('.input-categoria-opcao').value = categoriaSalva;
            clone.querySelector('.input-telefone-opcao').value = telefoneSalvo;

            // Adiciona na tela
            lista.appendChild(clone);
            
            // Procura o select que acabou de ser criado (fica no último filho da lista)
            const selectRecemCriado = lista.lastElementChild.querySelector('.input-categoria-opcao');
            // Roda a verificação para ele já abrir mostrando o campo caso o salvo seja "redirecionamento"
            verificarRedirecionamento(selectRecemCriado);
        }

        function adicionarProduto(codigo = '', nome = '', preco = '', categoriaSalva = '') {
            const lista = document.getElementById('lista-produtos');
            const template = document.getElementById('template-produto');
            const clone = template.content.cloneNode(true);
            
            clone.querySelector('.input-codigo').value = codigo;
            clone.querySelector('.input-nome').value = nome;
            clone.querySelector('.input-preco').value = preco;

            const categorias = getCategorias();
            const select = clone.querySelector('.input-categoria-select');
            
            categorias.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.innerText = cat;
                select.appendChild(option);
            });
            
            if (categoriaSalva) {
                select.value = categoriaSalva;
            }

            lista.appendChild(clone);
        }

        function removerLinha(botao) {
            botao.parentElement.remove();
        }

        function getSelectedDays() {
            const checkboxes = document.querySelectorAll('input[name="dias"]:checked');
            const dias = Array.from(checkboxes).map(cb => cb.value);
            return dias;
        }

        // ==== CARREGAR OS DADOS QUANDO ABRIR A PÁGINA ====
        fetch('/api/config')
            .then(res => res.json())
            .then(data => {
                document.getElementById('saudacao').value = data.saudacao || '';
                
                const listaOpcoes = document.getElementById('lista-opcoes');
                listaOpcoes.innerHTML = ''; 
                
                if (data.opcoes && data.opcoes.length > 0) {
                    data.opcoes.forEach(opcao => {
                        // Passando o telefone (se existir) na hora de criar
                        adicionarOpcao(opcao.id, opcao.descricao, opcao.categoria, opcao.telefone || '');
                    });
                } else {
                    adicionarOpcao();
                }

                document.getElementById('inicio').value = data.horarioInicio || '';
                document.getElementById('fim').value = data.horarioFim || '';
                document.getElementById('almocoInicio').value = data.almocoInicio || '';
                document.getElementById('almocoFim').value = data.almocoFim || '';

                if (data.diasFuncionamento) {
                    data.diasFuncionamento.forEach(dia => {
                        const checkbox = document.querySelector(`input[name="dias"][value="${dia}"]`);
                        if (checkbox) checkbox.checked = true;
                    });
                }

                document.getElementById('categorias-produtos').value = data.categoriasProdutos ? data.categoriasProdutos.join(', ') : '';

                const lista = document.getElementById('lista-produtos');
                lista.innerHTML = ''; 
                if (data.produtos && data.produtos.length > 0) {
                    data.produtos.forEach(produto => {
                        const precoVisto = produto.preco.toString().replace('.', ','); 
                        adicionarProduto(produto.id, produto.nome, precoVisto, produto.categoria); 
                    });
                } else {
                    adicionarProduto();
                }
            });

        // ==== ENVIAR DADOS AO CLICAR EM SALVAR ====
        function salvar() {
            const opcoes = getListaOpcoes();
            const diasSelecionados = getSelectedDays();
            const arrayProdutos = getDadosTabela();
            const categoriasProdutos = getCategorias();

            const dados = {
                saudacao: document.getElementById('saudacao').value,
                opcoes: opcoes,
                horarioInicio: document.getElementById('inicio').value,
                horarioFim: document.getElementById('fim').value,
                almocoInicio: document.getElementById('almocoInicio').value,
                almocoFim: document.getElementById('almocoFim').value,
                diasFuncionamento: diasSelecionados,
                produtos: arrayProdutos,
                categoriasProdutos: categoriasProdutos,
            };

            fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            }).then(res => {
                if (!res.ok) throw new Error("Erro no servidor");
                const status = document.getElementById('status');
                status.innerText = "Salvo com sucesso!";
                setTimeout(() => status.innerText = "", 3000);
            }).catch(erro => {
                console.error("Erro ao salvar:", erro);
                const status = document.getElementById('status');
                status.style.color = 'red';
                status.innerText = "Erro ao salvar. Tente novamente.";
                setTimeout(() => status.innerText = "", 3000);
            });
        }
    </script>
</body>
</html>
